---
layout: searchList
title: Search
permalink: /search/
public: true
---
<div id="search-page">
    <div class="search-container">
        <label for="searchInput" class="visually-hidden">검색</label>
        <input type="text" id="searchInput" placeholder="검색하세요" class="search-input">
        <div id="searchResults" class="search-results-page"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get('searchString');

    if (searchQuery) {
        document.getElementById('searchInput').value = searchQuery;
        waitForSearchInit().then(function() {
            performPageSearch(searchQuery);
        }).catch(function() {
            showError('검색 초기화 중 오류가 발생했습니다.');
        });
    }

    document.getElementById('searchInput').addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
            performPageSearch(this.value);
        }
    });
});

function waitForSearchInit() {
    return new Promise(function(resolve, reject) {
        const maxAttempts = 50;
        let attempts = 0;

        function check() {
            if (window.fuse && window.searchIndex && window.searchIndex.length > 0) {
                resolve();
            } else if (attempts >= maxAttempts) {
                reject(new Error('Search initialization timeout'));
            } else {
                attempts++;
                setTimeout(check, 100);
            }
        }
        check();
    });
}

function showError(message) {
    const container = document.getElementById('searchResults');
    container.textContent = '';
    const errorDiv = document.createElement('div');
    errorDiv.className = 'no-results';
    errorDiv.textContent = message;
    container.appendChild(errorDiv);
}

function performPageSearch(query) {
    if (!query.trim()) return;

    if (!window.fuse) {
        showError('검색이 초기화되지 않았습니다.');
        return;
    }

    const results = performSearch(query);
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.textContent = '';

    if (results.length === 0) {
        showError('검색 결과가 없습니다.');
        return;
    }

    results.forEach(function(result) {
        const item = result.item;
        const score = Math.round((1 - result.score) * 100);

        const resultItem = document.createElement('div');
        resultItem.className = 'search-result-item';

        const title = document.createElement('h3');
        title.className = 'search-result-title';

        const link = document.createElement('a');
        link.href = item.url;
        link.textContent = item.title;
        title.appendChild(link);

        const typeSpan = document.createElement('span');
        typeSpan.className = 'search-result-type';
        typeSpan.textContent = '[' + item.type + ']';
        title.appendChild(typeSpan);

        const content = document.createElement('p');
        content.className = 'search-result-content';
        content.textContent = item.summary || item.content.substring(0, 200) + '...';

        const meta = document.createElement('div');
        meta.className = 'search-result-meta';

        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'search-result-score';
        scoreSpan.textContent = '일치도: ' + score + '%';
        meta.appendChild(scoreSpan);

        const dateSpan = document.createElement('span');
        dateSpan.className = 'search-result-date';
        dateSpan.textContent = new Date(item.date).toLocaleDateString();
        meta.appendChild(dateSpan);

        if (item.tags && item.tags.length) {
            const tagsSpan = document.createElement('span');
            tagsSpan.className = 'search-result-tags';
            tagsSpan.textContent = '태그: ' + item.tags.join(', ');
            meta.appendChild(tagsSpan);
        }

        resultItem.appendChild(title);
        resultItem.appendChild(content);
        resultItem.appendChild(meta);
        resultsContainer.appendChild(resultItem);
    });
}
</script>
